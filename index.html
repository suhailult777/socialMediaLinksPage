<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .profile-container {
            text-align: center;
            background: linear-gradient(145deg, #2a2a2a, #333333);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .profile-container img {
            border-radius: 50%;
            width: 120px;
            height: 120px;
            object-fit: cover;
            margin-bottom: 5px;
            border: 3px solid #0073b1;
            box-shadow: 0 4px 15px rgba(0, 115, 177, 0.3);
        }

        .profile-container h1 {
            margin: 10px 0;
            font-size: 24px;
            color: #ffffff;
        }

        .about-section {
            margin-bottom: 15px;
            font-size: 16px;
            color: #e0e0e0;
            line-height: 1.4;
            text-align: justify;
            padding: 0 15px;
        }

        .about-section h2 {
            text-align: center;
            margin: 10px 0;
            color: #ffffff;
        }

        .about-section p {
            margin: 10px 0;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 10px 0;
            padding: 0 20px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        .animated-button {
            --transition: 0.28s;
            --font-size: 0.875rem;
            cursor: pointer;
            letter-spacing: calc(var(--font-size) * 0.02);
            font-family: sans-serif;
            font-weight: bold;
            background: linear-gradient(145deg, #2a2a2a, #333333);
            font-size: var(--font-size);
            border-radius: calc(var(--font-size) * 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            position: relative;
            transition: border-color var(--transition);
            margin: 0;
            min-width: 120px;
            overflow: hidden;
        }

        .animated-button>span {
            background: transparent;
            padding: calc(var(--font-size) * 0.7) calc(var(--font-size) * 1);
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr calc((var(--font-size) * 1.75) * var(--hovered, 0));
            align-items: center;
            gap: calc(var(--font-size) * 0.5);
            transition: grid-template-columns var(--transition);
        }

        .animated-button:after {
            content: "";
            position: absolute;
            inset: calc(var(--font-size) * -0.025);
            background: rgba(255, 255, 255, 0.1);
            filter: blur(calc(var(--font-size) * 0.75));
            scale: var(--hovered, 0);
            z-index: -1;
            transition: scale var(--transition);
        }

        .animated-button:hover {
            --hovered: 1;
            border-color: rgba(255, 255, 255, 0.2);
            background: linear-gradient(145deg, #333333, #3a3a3a);
        }

        .animated-button span span {
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .animated-button .arrow-icon {
            width: calc(var(--font-size) * 1.25);
            height: calc(var(--font-size) * 1.25);
            stroke-width: 2;
            translate: calc((1 - var(--hovered, 0)) * (var(--font-size) * 3)) 0;
            opacity: var(--hovered, 0);
            transition: translate var(--transition) ease-in-out, opacity var(--transition) ease-in-out;
            stroke: #ffffff;
        }

        .animated-button:is(:focus-visible, :hover) {
            --hovered: 1;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 10px;
        }

        .social-links a {
            text-decoration: none;
            color: #ffffff;
            font-size: 24px;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: #0073b1;
            transform: translateY(-2px);
        }

        .social-links i {
            transition: color 0.3s ease;
        }

        @media screen and (max-width: 480px) {
            .profile-container {
                padding: 15px;
            }

            .button-group {
                flex-direction: column;
                gap: 10px;
            }

            .animated-button {
                width: 100%;
            }
        }

        @media screen and (max-width: 320px) {
            .profile-container img {
                width: 100px;
                height: 100px;
            }

            .social-links {
                gap: 15px;
            }

            .social-links a {
                font-size: 22px;
            }

            .animated-button {
                --font-size: 0.8rem;
            }
        }
    </style>
</head>
