<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Projects - Mohd Suhail Idrisi</title>
    <link rel="stylesheet" href="myproject.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <button id="theme-toggle" class="theme-toggle-button" aria-label="Toggle theme">
        <i class="fas fa-sun"></i>

    <!-- Transition element -->

    <div class="projects-container" id="projects-container"></div>
    <script src="myproject.js"></script>
